<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NPS INTERNO ventas STELLANTIS</title>
<style>
:root{
  --navy:#0f2744; --navy-2:#173a63; --sky:#7cc4ff; --bg:#eef2f7; --card:#fff; --line:#d9e1ec;
  --ink:#14233a; --muted:#5f6f86;
  --green:#2e9e55; --green-bg:#d6f0dd; --green-ink:#14532d;
  --yellow:#e0a100; --yellow-bg:#fdecb0; --yellow-ink:#6b4a00;
  --red:#d63b3b; --red-bg:#fbd5d5; --red-ink:#7f1d1d;
  --none:#9aa5b5; --none-bg:#f1f4f8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:var(--navy)}
.hwrap{margin:0 auto;padding:16px 28px;display:flex;align-items:center;gap:18px}
.logo{height:56px;width:auto;display:block}
.titles{flex:1}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.02em;color:#fff;line-height:1.15}
h1 b{color:var(--sky);font-weight:700}
.sub{color:#a9bdd6;font-size:13px;margin-top:2px}
.salir{color:#a9bdd6;font-size:13px;cursor:pointer;text-decoration:underline;background:none;border:0;font-family:inherit}
.info{background:#fff;border-bottom:1px solid var(--line)}
.iwrap{margin:0 auto;padding:10px 28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.tag{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.tag b{color:var(--ink)}
.upd{margin-left:auto}
main{margin:0 auto;padding:6px 28px 40px}
.sec{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:20px}}
.bc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;border-top:6px solid var(--none)}
.bc.green{border-top-color:var(--green)}.bc.yellow{border-top-color:var(--yellow)}.bc.red{border-top-color:var(--red)}
.bc .n{font-size:14px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.bc .v{font-size:48px;font-weight:700;line-height:1.1;margin:6px 0 4px}
.bc .tt{font-size:12px;color:var(--muted);margin-bottom:12px}
.bc.green .v{color:var(--green)}.bc.yellow .v{color:var(--yellow)}.bc.red .v{color:var(--red)}.bc.none .v{color:var(--none)}
.mini{display:flex;flex-direction:column;gap:6px;font-size:13px}
.mini span{display:flex;justify-content:space-between;border-radius:8px;padding:5px 10px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:18px;padding:6px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer;background:#fff;color:var(--ink)}
.chip:hover{border-color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#det{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:900px){#det{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.card h3{margin:0 0 10px;font-size:17px;color:var(--navy)}
table{width:100%;border-collapse:collapse}
th{font-weight:700;color:var(--muted);text-align:center;padding:6px;font-size:13px}
th:first-child,td:first-child{text-align:left;width:34%}
td{padding:8px 6px;text-align:center;border-top:1px solid var(--line)}
td:first-child{font-weight:600}
.p{display:inline-block;min-width:78px;border-radius:8px;padding:4px 8px;font-weight:700;font-size:16px}
.p small{display:block;font-size:11px;font-weight:400;opacity:.8}
.green.p,.mini .green{background:var(--green-bg);color:var(--green-ink)}
.yellow.p,.mini .yellow{background:var(--yellow-bg);color:var(--yellow-ink)}
.red.p,.mini .red{background:var(--red-bg);color:var(--red-ink)}
.none.p,.mini .none{background:var(--none-bg);color:var(--none)}
.tot td{background:var(--bg);font-weight:700}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:16px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.leg b{color:var(--ink)}
.lock{max-width:440px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 30px;text-align:center}
.lock h2{margin:0 0 6px;font-size:20px;color:var(--navy)}
.lock p{margin:0 0 20px;color:var(--muted)}
.lock input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;font-size:16px;margin-bottom:12px}
.btn{width:100%;height:46px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:600 15px inherit;font-family:inherit;cursor:pointer}
.btn:hover{background:var(--navy-2)}
.err{color:var(--red);min-height:22px;margin-top:10px;font-size:13px;font-weight:600}
</style>
</head>

    <div class="titles">
      <h1>NPS INTERNO ventas <b>STELLANTIS</b></h1>
      <div class="sub">Grupo GRP · Calidad y experiencia del cliente</div>
    </div>
    <button class="salir" id="salir" style="display:none">Salir</button>
  </div>
</header>

<div class="info" id="infoWrap" style="display:none"><div class="iwrap" id="info"></div></div>

<main>
  <div class="lock" id="lock">
    <h2>Acceso al tablero</h2>
    <p>Ingresá el código que te dio el equipo de Calidad.</p>
    <form id="form">
      <input type="password" id="codigo" placeholder="Código de acceso" autocomplete="current-password" autofocus>
      <button class="btn" type="submit" id="entrar">Ingresar</button>
      <div class="err" id="err"></div>
    </form>
  </div>

  <div id="dash" style="display:none">
    <div class="sec">NPS global por marca</div>
    <div class="grid" id="glob"></div>

    <div class="sec">Detalle por marca y sucursal</div>
    <div class="chips" id="chips"></div>
    <div id="det"></div>

    <div class="leg">
      <span><i style="background:var(--green)"></i><b>Verde:</b> 96 o más</span>
      <span><i style="background:var(--yellow)"></i><b>Amarillo:</b> 90,5 a 95,99</span>
      <span><i style="background:var(--red)"></i><b>Rojo:</b> menos de 90,5</span>
    </div>
  </div>
</main>

<script>
(function(){
"use strict";
var MARCAS=["FIAT","PEUGEOT","CITROEN","TRAILCAR"];
var ORDEN_DET=["FIAT","TRAILCAR","CITROEN","PEUGEOT"];
var LABEL={FIAT:"Fiat",PEUGEOT:"Peugeot",CITROEN:"Citroën",TRAILCAR:"Trailcar"};
var SUCS={FIAT:["BAHIA BLANCA","VIEDMA","TANDIL"],PEUGEOT:["BAHIA BLANCA"],CITROEN:["BAHIA BLANCA"],TRAILCAR:["BAHIA BLANCA","TANDIL"]};
var SUC_LABEL={"BAHIA BLANCA":"Bahía Blanca","VIEDMA":"Viedma","TANDIL":"Tandil"};
var VERDE=96, AMARILLO=90.5, KEY="nps_ventas_codigo_acceso", REFRESCO_MS=10*60*1000;
var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function color(v){return v==null?"none":v>=VERDE?"green":v>=AMARILLO?"yellow":"red"}
function fmt(v){
  if(v==null) return "–";
  var r=Math.round(v*10)/10;
  if((v>=VERDE)!==(r>=VERDE)||(v>=AMARILLO)!==(r>=AMARILLO)) r=Math.floor(v*100)/100;
  var dec=(r*10%1!==0)?2:1;
  return r.toLocaleString("es-AR",{minimumFractionDigits:dec,maximumFractionDigits:dec});
}
function fdate(iso){var p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function periodo(c){
  var d=c.desde.split("-"),h=c.hasta.split("-");
  if(d[0]===h[0]&&d[1]===h[1]) return MESES[+d[1]-1]+" "+d[0];
  return fdate(c.desde)+" al "+fdate(c.hasta);
}
function guardar(v){try{if(v==null)localStorage.removeItem(KEY);else localStorage.setItem(KEY,v)}catch(e){}}
function leer(){try{return localStorage.getItem(KEY)}catch(e){return null}}

function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function descifrar(o,codigo){
  var s=crypto.subtle;
  var km=await s.importKey("raw",new TextEncoder().encode(codigo),"PBKDF2",false,["deriveKey"]);
  var k=await s.deriveKey({name:"PBKDF2",salt:b64(o.salt),iterations:o.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var d=await s.decrypt({name:"AES-GCM",iv:b64(o.iv)},k,b64(o.datos));
  return JSON.parse(new TextDecoder().decode(d));
}
async function traer(){
  var r=await fetch("datos.enc.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("nodatos");
  return r.json();
}

function calc(rows){
  var p=0,n=0,d=0;
  rows.forEach(function(r){p+=r.p;n+=r.n;d+=r.d});
  var t=p+n+d;
  return {p:p,n:n,d:d,tot:t,nps:t?(p-d)/t*100:null};
}

var DATOS=null,SEL="Todas";
function deMarca(m){return DATOS.filas.filter(function(r){return r.m===m})}
function porCanal(rows,c){return rows.filter(function(r){return r.c===c})}
function sucursalesDe(m){
  return SUCS[m];
}
function pill(rows){
  var c=calc(rows);
  return '<span class="p '+color(c.nps)+'">'+fmt(c.nps)+'<small>n='+c.tot+'</small></span>';
}
function renderGlobal(){
  $("glob").innerHTML=MARCAS.map(function(m){
    var rs=deMarca(m),a=calc(rs),p=calc(porCanal(rs,"PDA")),c=calc(porCanal(rs,"CONV"));
    return '<div class="bc '+color(a.nps)+'"><div class="n">'+LABEL[m].toUpperCase()+'</div><div class="v">'+fmt(a.nps)+'</div><div class="tt">'+a.tot+' encuestas</div>'
      +'<div class="mini"><span class="'+color(p.nps)+'"><em style="font-style:normal">Plan de ahorro</em><em style="font-style:normal">'+fmt(p.nps)+'</em></span>'
      +'<span class="'+color(c.nps)+'"><em style="font-style:normal">Convencional</em><em style="font-style:normal">'+fmt(c.nps)+'</em></span></div></div>';
  }).join("");
}
function renderDetalle(){
  $("chips").innerHTML=["Todas"].concat(MARCAS).map(function(m){
    return '<button class="chip'+(m===SEL?' on':'')+'" data-m="'+m+'">'+(m==="Todas"?"Todas":LABEL[m])+'</button>';
  }).join("");
  $("det").innerHTML=ORDEN_DET.filter(function(m){return SEL==="Todas"||SEL===m}).map(function(m){
    var rs=deMarca(m);
    var filas=sucursalesDe(m).map(function(s){
      var x=rs.filter(function(r){return r.s===s});
      return '<tr><td>'+esc(SUC_LABEL[s]||s)+'</td><td>'+pill(porCanal(x,"PDA"))+'</td><td>'+pill(porCanal(x,"CONV"))+'</td><td>'+pill(x)+'</td></tr>';
    }).join("");
    return '<div class="card"><h3>'+LABEL[m]+'</h3><table><thead><tr><th>Sucursal</th><th>Plan de ahorro</th><th>Convencional</th><th>Global</th></tr></thead><tbody>'
      +filas+'<tr class="tot"><td>Total marca</td><td>'+pill(porCanal(rs,"PDA"))+'</td><td>'+pill(porCanal(rs,"CONV"))+'</td><td>'+pill(rs)+'</td></tr></tbody></table></div>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".chip"),function(b){b.onclick=function(){SEL=b.getAttribute("data-m");renderDetalle()}});
}
function mostrar(c){
  DATOS=c;
  $("lock").style.display="none";$("dash").style.display="block";$("salir").style.display="inline";$("infoWrap").style.display="block";
  $("info").innerHTML='<span class="tag">Período: <b>'+esc(periodo(c))+'</b></span>'
    +'<span class="tag upd">Actualizado: '+new Date(c.generado).toLocaleString("es-AR",{dateStyle:"short",timeStyle:"short"})+'</span>';
  renderGlobal();renderDetalle();
}
function pedirCodigo(msg){
  $("dash").style.display="none";$("salir").style.display="none";$("infoWrap").style.display="none";$("lock").style.display="block";
  $("err").textContent=msg||"";$("codigo").value="";$("entrar").disabled=false;$("entrar").textContent="Ingresar";
}

var timer=null;
async function entrar(codigo,silencioso){
  var cifrado;
  try{cifrado=await traer()}catch(e){
    if(!silencioso){pedirCodigo("Todavía no hay datos publicados. Probá de nuevo más tarde.")}
    return;
  }
  try{
    var c=await descifrar(cifrado,codigo);
    guardar(codigo);mostrar(c);
    clearInterval(timer);timer=setInterval(function(){entrar(codigo,true)},REFRESCO_MS);
  }catch(e){
    if(silencioso) return;
    guardar(null);pedirCodigo("Código incorrecto. Revisalo e intentá de nuevo.");
  }
}
$("form").onsubmit=function(e){
  e.preventDefault();
  var c=$("codigo").value.trim();if(!c)return;
  $("entrar").disabled=true;$("entrar").textContent="Verificando…";$("err").textContent="";
  entrar(c,false);
};
$("salir").onclick=function(){guardar(null);clearInterval(timer);pedirCodigo("")};
var g=leer();if(g) entrar(g,false);
})();
</script>
</body>
